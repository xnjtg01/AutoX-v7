name: BenBen standalone APK
on:
  push:
    branches: [benben-assistant-v1]
    paths: ['benben-android/**', '.github/workflows/benben-apk.yml']
  workflow_dispatch:
# Collapse rapid development commits into one build, avoiding unnecessary Actions minutes.
concurrency:
  group: benben-apk-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Kingshot task image templates
        uses: actions/checkout@v4
        with:
          repository: KingshotAuto/Kingshot-bot
          ref: 3cc4c432a07dbf3aef390ae2840180589ccf3a82
          path: kingshot-reference
          sparse-checkout: |
            templates/images
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Bundle MIT-licensed Kingshot templates in Android assets
        run: |
          mkdir -p benben-android/app/src/main/assets/kingshot
          cp -R kingshot-reference/templates/images/. benben-android/app/src/main/assets/kingshot/
          cp kingshot-reference/LICENSE benben-android/app/src/main/assets/kingshot/LICENSE.txt
          echo "Source: https://github.com/KingshotAuto/Kingshot-bot" > benben-android/app/src/main/assets/kingshot/SOURCE.txt
          echo "Pinned commit: 3cc4c432a07dbf3aef390ae2840180589ccf3a82" >> benben-android/app/src/main/assets/kingshot/SOURCE.txt
          test "$(find benben-android/app/src/main/assets/kingshot -iname '*.png' | wc -l)" -ge 120
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run offline regression tests then build APK
        working-directory: benben-android
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
          if grep -n "tap(b,360,960)" app/src/main/java/com/xnjtg/benben/DomesticScreenNavigation.java; then
            echo "V2.3 blocked regression returned: wrong reward grid tap"
            exit 1
          fi
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BenBen-offline-regression-results
          path: benben-android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Validate bundled templates in APK
        run: |
          python3 - <<'PY'
          import zipfile
          p="benben-android/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(p) as z:
              images=[n for n in z.namelist() if n.startswith("assets/kingshot/") and n.lower().endswith(".png")]
              print("Bundled Kingshot PNG templates:",len(images))
              assert len(images)>=120
              assert "assets/kingshot/LICENSE.txt" in z.namelist()
          PY
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenBen-Assistant-preview-APK
          path: benben-android/app/build/outputs/apk/debug/app-debug.apk

  mumu-e2e:
    # NEVER run untrusted PR code on Windows with MuMu or a game login.
    # Manual opt-in requires a dedicated runner labeled benben-mumu.
    if: ${{ vars.BENBEN_MUMU_E2E == 'enabled' && (github.event_name == 'workflow_dispatch' || vars.BENBEN_MUMU_ON_PUSH == 'true') }}
    needs: build
    runs-on: [self-hosted, Windows, benben-mumu]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: BenBen-Assistant-preview-APK
          path: ${{ runner.temp }}/benben-apk
      - name: Install on local MuMu, run game and report seven scenes
        shell: pwsh
        run: |
          ./.github/scripts/benben-mumu-e2e.ps1 -ApkPath "${{ runner.temp }}/benben-apk/app-debug.apk"
      # No user screenshots, game chat, or account IDs are uploaded.

  cloud-android:
    # GitHub-hosted Android, no user's Windows/MuMu or game credentials.
    # This job tests the assistant + synthetic domestic scenes, NOT real game.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: BenBen-Assistant-preview-APK
          path: cloud-artifacts
      - name: Enable KVM hardware acceleration for Ubuntu Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 12 cloud emulator, run scene tests and installed-app smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: benben-android
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon
            bash ../.github/scripts/benben-cloud-smoke.sh ../cloud-artifacts/app-debug.apk
      - name: Save emulator screenshots, UI hierarchy and Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BenBen-Cloud-Android-QA
          path: |
            cloud-android-report/
            benben-android/app/build/outputs/androidTest-results/
            benben-android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
