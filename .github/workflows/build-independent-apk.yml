name: Build independent Benben APK
on:
  push:
    branches: [benben-assistant-v1]
    paths: ['benben-native/**', '.github/workflows/build-independent-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build debug APK
        run: cd benben-native && gradle --no-daemon :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: benben-independent-debug-apk
          path: benben-native/app/build/outputs/apk/debug/*.apk
          retention-days: 14
