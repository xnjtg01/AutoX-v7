name: Benben official game smoke test

on:
  push:
    branches:
      - benben-assistant-v1
    paths:
      - .github/workflows/benben-real-game-smoke.yml
      - benben-assistant/**
      - scripts/benben/**
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Public Google Drive APK file ID"
        required: false
        default: "1fpa4cvuLPr7QaqxU9BDDVFCrv530cQ5W"
        type: string

permissions:
  contents: read

jobs:
  android-game-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK_PATH: /tmp/benben.apk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK from public Google Drive share
        env:
          DRIVE_ID: ${{ inputs.drive_file_id }}
        run: |
          set -euo pipefail
          mkdir -p smoke-artifacts
          python3 -m pip install --quiet gdown
          python3 -m gdown "https://drive.google.com/uc?id=${DRIVE_ID:-1fpa4cvuLPr7QaqxU9BDDVFCrv530cQ5W}" --output "$APK_PATH"
          FILESIZE=$(stat -c%s "$APK_PATH")
          echo "APK bytes: $FILESIZE" | tee smoke-artifacts/apk-size.txt
          test "$FILESIZE" -gt 1000000 || { echo "::error::APK download unexpectedly small"; exit 1; }
          sha256sum "$APK_PATH" | tee smoke-artifacts/apk-sha256.txt
          unzip -t "$APK_PATH" > smoke-artifacts/zip-integrity.txt || { echo "::error::APK zip integrity check failed"; exit 1; }
          unzip -Z1 "$APK_PATH" | grep -E '^lib/[^/]+/' | cut -d/ -f2 | sort -u | tee smoke-artifacts/native-architectures.txt || true

      - name: Record ABI translation experiment
        run: |
          echo "This run attempts ARM native-bridge translation on Android 35 x86_64." > smoke-artifacts/next-step.txt
          echo "ARM-only APK support is experimental and not guaranteed." >> smoke-artifacts/next-step.txt

      - name: Inspect Android package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt
          aapt dump badging "$APK_PATH" > smoke-artifacts/apk-badging.txt
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" smoke-artifacts/apk-badging.txt | head -n1)
          test -n "$PKG" || { echo "::error::Could not determine APK package identifier"; exit 1; }
          echo "GAME_PACKAGE=$PKG" >> "$GITHUB_ENV"
          echo "Package: $PKG" | tee smoke-artifacts/package-name.txt

      - name: Experiment - Android 35 x86_64 ARM translation (no login)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -u
            mkdir -p smoke-artifacts
            adb devices -l > smoke-artifacts/adb-devices.txt 2>&1
            adb shell getprop ro.product.cpu.abilist > smoke-artifacts/emulator-abis.txt 2>&1
            adb shell getprop ro.dalvik.vm.native.bridge > smoke-artifacts/native-bridge.txt 2>&1
            adb shell getprop ro.enable.native.bridge >> smoke-artifacts/native-bridge.txt 2>&1
            if ! adb install -r "$APK_PATH" > smoke-artifacts/install.txt 2>&1; then
              echo "::error::APK installation failed. See diagnostics artifact."
              adb logcat -d -t 2000 > smoke-artifacts/logcat.txt 2>&1 || true
              exit 1
            fi
            adb shell pm path "$GAME_PACKAGE" > smoke-artifacts/installed-package.txt 2>&1
            adb shell monkey -p "$GAME_PACKAGE" -c android.intent.category.LAUNCHER 1 > smoke-artifacts/launch.txt 2>&1
            sleep 25
            adb exec-out screencap -p > smoke-artifacts/launch.png || true
            adb shell dumpsys activity activities > smoke-artifacts/activities.txt 2>&1
            adb logcat -d -t 3500 > smoke-artifacts/logcat.txt 2>&1
            if ! grep -Fq "$GAME_PACKAGE" smoke-artifacts/activities.txt; then
              echo "::error::Game not found in activity stack after launch"
              exit 1
            fi
            echo "APK installed and activity stack contained game package; visual functionality not yet verified." > smoke-artifacts/next-step.txt

      - name: Publish validation summary
        if: always()
        run: |
          echo "## Benben APK validation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f smoke-artifacts/apk-size.txt ]; then cat smoke-artifacts/apk-size.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f smoke-artifacts/native-architectures.txt ]; then
            echo "### APK native ABIs" >> "$GITHUB_STEP_SUMMARY"
            cat smoke-artifacts/native-architectures.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f smoke-artifacts/next-step.txt ]; then
            echo "### Real game testing status" >> "$GITHUB_STEP_SUMMARY"
            cat smoke-artifacts/next-step.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benben-game-smoke-diagnostics
          path: smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7
