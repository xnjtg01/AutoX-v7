name: Benben official game smoke test

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Public Google Drive APK file ID"
        required: false
        default: "1fpa4cvuLPr7QaqxU9BDDVFCrv530cQ5W"
        type: string

permissions:
  contents: read

jobs:
  android-game-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK_PATH: /tmp/benben.apk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK from public Google Drive share
        env:
          DRIVE_ID: ${{ inputs.drive_file_id }}
        run: |
          set -euo pipefail
          mkdir -p smoke-artifacts
          python3 -m pip install --quiet gdown
          python3 -m gdown --id "${DRIVE_ID:-1fpa4cvuLPr7QaqxU9BDDVFCrv530cQ5W}" --output "$APK_PATH"
          FILESIZE=$(stat -c%s "$APK_PATH")
          echo "APK bytes: $FILESIZE" | tee smoke-artifacts/apk-size.txt
          test "$FILESIZE" -gt 1000000 || { echo "::error::APK download unexpectedly small"; exit 1; }
          sha256sum "$APK_PATH" | tee smoke-artifacts/apk-sha256.txt
          unzip -t "$APK_PATH" > smoke-artifacts/zip-integrity.txt || { echo "::error::APK zip integrity check failed"; exit 1; }
          unzip -Z1 "$APK_PATH" | grep -E '^lib/[^/]+/' | cut -d/ -f2 | sort -u | tee smoke-artifacts/native-architectures.txt || true

      - name: Inspect Android package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt
          aapt dump badging "$APK_PATH" > smoke-artifacts/apk-badging.txt
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" smoke-artifacts/apk-badging.txt | head -n1)
          test -n "$PKG" || { echo "::error::Could not determine APK package identifier"; exit 1; }
          echo "GAME_PACKAGE=$PKG" >> "$GITHUB_ENV"
          echo "Package: $PKG" | tee smoke-artifacts/package-name.txt

      - name: Run on Android emulator (no account login)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            adb devices -l | tee smoke-artifacts/adb-devices.txt
            adb install -r "$APK_PATH" 2>&1 | tee smoke-artifacts/install.txt
            adb shell pm path "$GAME_PACKAGE" | tee smoke-artifacts/installed-package.txt
            adb shell monkey -p "$GAME_PACKAGE" -c android.intent.category.LAUNCHER 1 2>&1 | tee smoke-artifacts/launch.txt
            sleep 25
            adb exec-out screencap -p > smoke-artifacts/launch.png
            adb shell dumpsys activity activities > smoke-artifacts/activities.txt
            adb logcat -d -t 3000 > smoke-artifacts/logcat.txt
            grep -Fq "$GAME_PACKAGE" smoke-artifacts/activities.txt || { echo "::error::Game package missing from activity stack"; exit 1; }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benben-game-smoke-diagnostics
          path: smoke-artifacts/
          if-no-files-found: warn
          retention-days: 7
