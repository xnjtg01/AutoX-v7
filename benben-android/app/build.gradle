plugins { id 'com.android.application' }
android {
    namespace 'com.xnjtg.benben'
    compileSdk 35
    defaultConfig { applicationId 'com.xnjtg.benben'; minSdk 26; targetSdk 28; versionCode 19; versionName '1.9.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // Bundled/offline Chinese model: works without Google Play Services.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
